<!DOCTYPE html>
	<head>
		<title>Web de ejemplo</title>
	</head>
	<body><!--Con br hacemos un salto de linea-->
		Esta es linea, y a continuacion insertamos un salto de linea</br>
		<!--Center nos muestra un "parrafo" centrado-->
		<center>Otra linea</center>
		Esto es otro salto de linea</br>
		<!--Align nos indica hacia donde va nuestro texto, como observamos, tenemos 3 posiciones
		Izquierda
		Derecha
		Centro-->
		<p align="left">Parrafo alineado a la izquierda</p>
		<p align="center">Este esta alineado al centro</p>
		<p align="right">Este otro a la derecha</p>
	</body>
</html>
